<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light">
    <meta name="supported-color-schemes" content="light">
    <title>Download Fleek</title>
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f9f9f9; color: #000; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; padding: 40px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo { max-width: 150px; margin-bottom: 25px; }
        .hook { font-size: 16px; margin-bottom: 25px; color: #555; padding: 15px; background-color: #f4f4f4; border-left: 4px solid #000; text-align: left; font-style: italic; }
        .title { font-size: 24px; font-weight: 800; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .value-prop { font-size: 16px; line-height: 1.6; margin-bottom: 35px; color: #333; text-align: left; }
        .cta-button { background-color: #000000; color: #ffffff; text-decoration: none; padding: 16px 35px; font-size: 16px; font-weight: 700; border-radius: 4px; display: inline-block; text-transform: uppercase; letter-spacing: 1px; }
        .footer { margin-top: 40px; font-size: 12px; color: #888; text-align: center; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body style="background-color: #f9f9f9; color: #000000; margin: 0; padding: 20px;">
    <div class="container" style="background-color: #ffffff; color: #000000; max-width: 600px; margin: 0 auto; padding: 40px 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <img src="https://d314e77m1bz5zy.cloudfront.net/bee/Images/bmsx/wfjybjh5/1vx/awb/7et/black_logo_transparent_background_2.png" alt="Fleek Logo" class="logo">
        
        <!-- LLM Generated Localized News Hook -->
        <div class="hook">
            "{{LOCALIZED_HOOK_NEWS_FASHION_SUSTAINABILITY}}"
        </div>

        <h1 class="title">{{LOCALIZED_HEADING_ACCESS_VINTAGE}}</h1>
        
        <p class="value-prop">
            {{LOCALIZED_GREETING_HI}} {{USER_FIRST_NAME_FALLBACK_THERE}},<br><br>
            {{LOCALIZED_BODY_COPY_VALUE_PROP_NO_DISCOUNT}}
        </p>

        <a href="{{APP_STORE_LINK}}" class="cta-button">{{LOCALIZED_CTA_DOWNLOAD_APP}}</a>
        
        <div class="footer">
            {{LOCALIZED_FOOTER_COPYRIGHT}}<br>
            <a href="{{UNSUBSCRIBE_LINK}}" style="color: #888;">{{LOCALIZED_UNSUBSCRIBE}}</a>
        </div>
    </div>
</body>
</html>
