version: '3.8'

services:
  crm-email-tester:
    build: .
    container_name: crm-email-tester
    ports:
      - "5000:5000"
    env_file:
      - .env
    restart: unless-stopped
    # If you want to use Cloudflare Tunnel directly in docker-compose,
    # you can add another service here using cloudflare/cloudflared
    # and pass your TUNNEL_TOKEN.
